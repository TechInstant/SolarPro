<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical drawing of DIN rail surge protection device and circuit breakers">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0v25" fill="none" stroke="#E1DACA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F2EFE6"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- din rail -->
  <rect x="100" y="286" width="600" height="18" fill="#D8D1C1" stroke="#0B1F2A" stroke-width="3"/>

  <!-- SPD module (4 pole) -->
  <g>
    <rect x="140" y="170" width="220" height="250" rx="6" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="5"/>
    <g stroke="#C9C2B2" stroke-width="3"><path d="M195 170v250M250 170v250M305 170v250"/></g>
    <g fill="#3F8F5B">
      <rect x="152" y="196" width="32" height="22" rx="2"/><rect x="207" y="196" width="32" height="22" rx="2"/>
      <rect x="262" y="196" width="32" height="22" rx="2"/><rect x="317" y="196" width="32" height="22" rx="2"/>
    </g>
    <g fill="#132B39">
      <rect x="152" y="240" width="32" height="130" rx="3"/><rect x="207" y="240" width="32" height="130" rx="3"/>
      <rect x="262" y="240" width="32" height="130" rx="3"/><rect x="317" y="240" width="32" height="130" rx="3"/>
    </g>
    <text x="250" y="400" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#0B1F2A" letter-spacing="2">SPD T2 · 40kA</text>
  </g>

  <!-- breakers -->
  <g>
    <rect x="400" y="190" width="70" height="210" rx="4" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="4"/>
    <rect x="418" y="232" width="34" height="46" rx="3" fill="#0B1F2A"/>
    <text x="435" y="330" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#0B1F2A">C32</text>
    <rect x="480" y="190" width="70" height="210" rx="4" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="4"/>
    <rect x="498" y="232" width="34" height="46" rx="3" fill="#0B1F2A"/>
    <text x="515" y="330" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#0B1F2A">C20</text>
    <rect x="560" y="190" width="100" height="210" rx="4" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="4"/>
    <rect x="578" y="232" width="64" height="46" rx="3" fill="#A87545"/>
    <text x="610" y="330" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#0B1F2A">RCD</text>
    <text x="610" y="352" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#4A5B64">30mA</text>
  </g>

  <g stroke="#A87545" stroke-width="2" fill="none"><path d="M250 170v-60"/></g>
  <text x="250" y="96" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#A87545">GREEN = PROTECTED · RED = REPLACE</text>

  <text x="40" y="566" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545" letter-spacing="1">PROTECTIVE DEVICES</text>
  <text x="760" y="566" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#4A5B64">DIN RAIL · 230/400V</text>
</svg>
