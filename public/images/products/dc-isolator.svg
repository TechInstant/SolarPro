<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical drawing of a DC isolator and surge protection enclosure">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0v25" fill="none" stroke="#E1DACA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F2EFE6"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- enclosure -->
  <rect x="216" y="120" width="368" height="356" rx="10" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="5"/>
  <rect x="216" y="120" width="368" height="46" rx="10" fill="#0B1F2A"/>
  <rect x="216" y="150" width="368" height="16" fill="#0B1F2A"/>
  <text x="240" y="152" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#F7F5EF" letter-spacing="3">DC COMBINER · IP66</text>

  <!-- din rail -->
  <rect x="248" y="206" width="304" height="12" fill="#D8D1C1"/>
  <!-- breakers -->
  <g>
    <rect x="256" y="218" width="46" height="104" rx="3" fill="#F7F5EF" stroke="#0B1F2A" stroke-width="3"/>
    <rect x="266" y="238" width="26" height="30" rx="3" fill="#3F8F5B"/>
    <rect x="310" y="218" width="46" height="104" rx="3" fill="#F7F5EF" stroke="#0B1F2A" stroke-width="3"/>
    <rect x="320" y="238" width="26" height="30" rx="3" fill="#3F8F5B"/>
    <rect x="364" y="218" width="46" height="104" rx="3" fill="#F7F5EF" stroke="#0B1F2A" stroke-width="3"/>
    <rect x="374" y="238" width="26" height="30" rx="3" fill="#A87545"/>
  </g>
  <!-- surge arrester -->
  <g>
    <rect x="426" y="218" width="120" height="104" rx="3" fill="#132B39" stroke="#0B1F2A" stroke-width="3"/>
    <rect x="440" y="234" width="28" height="44" rx="2" fill="#3F8F5B"/>
    <rect x="474" y="234" width="28" height="44" rx="2" fill="#3F8F5B"/>
    <rect x="508" y="234" width="28" height="44" rx="2" fill="#3F8F5B"/>
    <text x="486" y="306" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#DDEEDC" letter-spacing="1">SPD TYPE 2</text>
  </g>

  <!-- rotary isolator -->
  <circle cx="300" cy="392" r="42" fill="#A87545" stroke="#07151D" stroke-width="5"/>
  <path d="M300 392v-26" stroke="#07151D" stroke-width="8" stroke-linecap="round"/>
  <text x="300" y="456" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#4A5B64">600V ROTARY ISOLATOR</text>

  <!-- busbar -->
  <rect x="384" y="356" width="170" height="20" rx="3" fill="#A87545"/>
  <rect x="384" y="392" width="170" height="20" rx="3" fill="#8A929B"/>
  <text x="470" y="440" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#4A5B64">+ / − BUSBARS</text>

  <!-- glands -->
  <g fill="#0B1F2A">
    <rect x="276" y="476" width="24" height="26" rx="4"/>
    <rect x="330" y="476" width="24" height="26" rx="4"/>
    <rect x="446" y="476" width="24" height="26" rx="4"/>
    <rect x="500" y="476" width="24" height="26" rx="4"/>
  </g>

  <text x="40" y="566" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545" letter-spacing="1">DC PROTECTION BOARD</text>
</svg>
