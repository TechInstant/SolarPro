<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical drawing of an electric fence energizer and fence strands">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0v25" fill="none" stroke="#E1DACA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F2EFE6"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- energizer unit -->
  <rect x="100" y="140" width="250" height="300" rx="12" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="5"/>
  <rect x="100" y="140" width="250" height="56" rx="12" fill="#0B1F2A"/>
  <rect x="100" y="180" width="250" height="16" fill="#0B1F2A"/>
  <text x="124" y="176" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#F7F5EF" letter-spacing="3">ENERGIZER</text>
  <rect x="130" y="222" width="190" height="70" rx="4" fill="#132B39"/>
  <text x="146" y="266" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="28" fill="#65BA84">9.2 kV</text>
  <g fill="#3F8F5B"><circle cx="146" cy="318" r="7"/></g>
  <circle cx="172" cy="318" r="7" fill="#A87545"/>
  <text x="192" y="323" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#4A5B64">ZONE 1 · ARMED</text>
  <!-- terminals -->
  <g fill="#0B1F2A"><circle cx="150" cy="400" r="12"/><circle cx="200" cy="400" r="12"/><circle cx="250" cy="400" r="12"/><circle cx="300" cy="400" r="12"/></g>
  <text x="225" y="470" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#4A5B64">FENCE · EARTH · SIREN</text>

  <!-- fence posts + strands -->
  <g stroke="#0B1F2A" stroke-width="10" stroke-linecap="square"><path d="M470 120v330M700 120v330"/></g>
  <g stroke="#8A929B" stroke-width="3">
    <path d="M470 150h230M470 190h230M470 230h230M470 270h230M470 310h230M470 350h230"/>
  </g>
  <g fill="#A87545">
    <rect x="462" y="144" width="16" height="12" rx="2"/><rect x="462" y="184" width="16" height="12" rx="2"/><rect x="462" y="224" width="16" height="12" rx="2"/>
    <rect x="462" y="264" width="16" height="12" rx="2"/><rect x="462" y="304" width="16" height="12" rx="2"/><rect x="462" y="344" width="16" height="12" rx="2"/>
    <rect x="692" y="144" width="16" height="12" rx="2"/><rect x="692" y="184" width="16" height="12" rx="2"/><rect x="692" y="224" width="16" height="12" rx="2"/>
    <rect x="692" y="264" width="16" height="12" rx="2"/><rect x="692" y="304" width="16" height="12" rx="2"/><rect x="692" y="344" width="16" height="12" rx="2"/>
  </g>
  <!-- warning plate -->
  <rect x="540" y="370" width="90" height="56" rx="3" fill="#A87545"/>
  <text x="585" y="394" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#FBFAF7" letter-spacing="1">DANGER</text>
  <text x="585" y="414" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#FBFAF7">ELECTRIC</text>
  <!-- lead-out -->
  <path d="M150 412c0 60 120 80 320 -62" fill="none" stroke="#3F8F5B" stroke-width="4" stroke-dasharray="10 6"/>

  <text x="40" y="566" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545" letter-spacing="1">ELECTRIC FENCE ENERGIZER</text>
  <text x="760" y="566" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#4A5B64">6-STRAND WALL-TOP</text>
</svg>
