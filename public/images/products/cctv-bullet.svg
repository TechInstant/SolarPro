<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Technical drawing of a bullet CCTV camera">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0v25" fill="none" stroke="#E1DACA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F2EFE6"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- wall plate + arm -->
  <rect x="120" y="170" width="40" height="150" rx="4" fill="#D8D1C1" stroke="#0B1F2A" stroke-width="4"/>
  <path d="M160 245h70l40 30" fill="none" stroke="#0B1F2A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="270" cy="275" r="16" fill="#0B1F2A"/>

  <!-- housing -->
  <g transform="rotate(-8 450 250)">
    <rect x="270" y="190" width="330" height="120" rx="22" fill="#FBFAF7" stroke="#0B1F2A" stroke-width="5"/>
    <!-- sun shield -->
    <path d="M262 184h370l-16 -28H290z" fill="#0B1F2A"/>
    <!-- lens ring -->
    <rect x="590" y="200" width="44" height="100" rx="10" fill="#0B1F2A"/>
    <circle cx="612" cy="250" r="30" fill="#132B39" stroke="#2C566B" stroke-width="4"/>
    <circle cx="612" cy="250" r="16" fill="#0E2430"/>
    <circle cx="604" cy="242" r="5" fill="#7FA3B4"/>
    <!-- IR leds -->
    <g fill="#A87545">
      <circle cx="580" cy="212" r="4"/><circle cx="580" cy="288" r="4"/>
    </g>
    <!-- label band -->
    <rect x="310" y="236" width="180" height="28" rx="3" fill="#E7E2D5"/>
    <text x="400" y="256" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#0B1F2A" letter-spacing="3">4MP · IP67</text>
  </g>

  <!-- cable -->
  <path d="M320 318c-10 60 -80 80 -150 120" fill="none" stroke="#0B1F2A" stroke-width="6" stroke-linecap="round"/>
  <rect x="150" y="430" width="44" height="24" rx="4" fill="#132B39"/>

  <!-- callouts -->
  <g stroke="#A87545" stroke-width="2" fill="none"><path d="M640 250h60M450 150v-50"/></g>
  <text x="706" y="244" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545">2.8mm</text>
  <text x="706" y="264" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545">LENS</text>
  <text x="450" y="90" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545" letter-spacing="2">SUN SHIELD</text>
  <text x="230" y="480" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#4A5B64">PoE · RJ45</text>

  <text x="40" y="566" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#A87545" letter-spacing="1">BULLET CAMERA</text>
  <text x="760" y="566" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#4A5B64">NIGHT VISION 40m</text>
</svg>
